name: Testing Container

on:
  workflow_call:
    inputs:
      shard_instance:
        description: "The shard instance for this workflow"
        required: true
        default: 1
        type: number
      max_shards:
        description: "THe max number of shards"
        required: true
        default: 1
        type: number

jobs:
  testing:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:${{ secrets.DB_PASSWORD }}@localhost:5432/test_db?pgbouncer=true&connection_limit=1
      DIRECT_URL: postgres://postgres:${{ secrets.DB_PASSWORD }}@localhost:5432/test_db
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      TEST_REPORT_EMAIL: ${{ secrets.TEST_REPORT_EMAIL }}
      TEST_REPORT_PASSWORD: ${{ secrets.TEST_REPORT_PASSWORD }}
      RESEND_API_KEY: $({ secrets.RESEND_API_KEY })
      RESEND_SENDING_MAIL: ${{ secrets.RESEND_SENDING_MAIL }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      CI: true

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "latest"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 5432; do
            sleep 1
          done

      - name: Run migrations
        run: pnpm db:migrate:dev

      - name: Launch the server in the background
        run: pnpm launch &

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Wait for server to be ready
        timeout-minutes: 5
        run: |
          until nc -z localhost 3000; do
            echo "Waiting for server on port 3000..."
            sleep 1
          done

      - name: Run tests
        run: pnpm test --shard=${{ inputs.shard_instance }}/${{ inputs.max_shards }}

      - name: Upload Playwright Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-logs-${{ inputs.shard_instance }}
          path: ./tests/logs
